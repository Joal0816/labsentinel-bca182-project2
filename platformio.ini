[platformio]
default_envs = rt_spark_f407zg_compile_only
src_dir = firmware/src
include_dir = firmware/include
boards_dir = boards
test_dir = firmware/test

[env:rt_spark_f407zg_compile_only]
platform = ststm32@20.0.0
board = rtspark_f407zg_unverified
framework = stm32cube
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.70201.0
extra_scripts = pre:tools/freertos_build.py
monitor_speed = 115200
build_flags =
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -D USE_HAL_DRIVER
    -D STM32F407xx
    -D RT_SPARK_HARDWARE_UNVERIFIED
    -I firmware/include

[env:native]
platform = native
build_flags = -I firmware/include -std=c11

