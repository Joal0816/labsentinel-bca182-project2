services:
  broker:
    image: eclipse-mosquitto:2
    container_name: labsentinel-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./services/mosquitto/acl:/mosquitto/config/acl:ro
      - ./services/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  influxdb:
    image: influxdb:2
    container_name: labsentinel-influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build: ./services/gateway
    container_name: labsentinel-gateway
    restart: unless-stopped
    env_file:
      - ${LABSENTINEL_ENV_FILE:-.env}
    environment:
      MQTT_HOST: broker
      INFLUX_URL: http://influxdb:8086
      GROUP_ID: ${GROUP_ID}
      DEVICE_ID: ${DEVICE_ID}
    depends_on:
      broker:
        condition: service_started
      influxdb:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: actual
    container_name: labsentinel-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:13.3.0
    container_name: labsentinel-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-replace-locally}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      DEVICE_ID: ${DEVICE_ID}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  mosquitto_data:
  mosquitto_log:
  influx_data:
  influx_config:
  grafana_data:

